name: Build Nokia XG-040G-MF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build airoha/an7583
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7583-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7583-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add custom LuCI packages
        run: |
          rm -rf package/feeds/luci/luci-theme-argon package/feeds/luci/luci-app-argon-config
          tmpdir=$(mktemp -d)
          git clone --depth=1 https://github.com/rchen14b/luci-app-airoha-npu.git "$tmpdir/airoha-npu"
          mkdir -p package/luci-app-airoha-npu
          rsync -a --exclude=.git --exclude=.github --exclude=luci-app-airoha-npu \
            "$tmpdir/airoha-npu/" package/luci-app-airoha-npu/
          patch --batch -d package/luci-app-airoha-npu -p1 < ci/patches/luci-app-airoha-npu-no-wifi.patch
          patch --batch -d package/luci-app-airoha-npu -p1 < ci/patches/luci-app-airoha-npu-theme-colors.patch
          git clone --depth=1 https://github.com/rchen14b/luci-theme-glass.git package/luci-theme-glass
          patch --batch -d package/luci-theme-glass -p1 < ci/patches/luci-theme-glass-menu-order.patch
          cp ci/assets/luci-theme-glass/po/zh_Hans/glass.po package/luci-theme-glass/po/zh_Hans/glass.po
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          patch --batch -d package/luci-app-argon-config -p1 < ci/patches/luci-app-argon-config-menu-order.patch
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          git clone --depth=1 https://github.com/eamonxg/luci-app-aurora-config.git package/luci-app-aurora-config
          patch --batch -d package/luci-app-aurora-config -p1 < ci/patches/luci-app-aurora-config-menu-order.patch
          git clone --depth=1 https://github.com/qwe3017/luci-app.git "$tmpdir/qwe3017-luci-app"
          cp -a "$tmpdir/qwe3017-luci-app/luci-app-natmode" package/
          cp -a "$tmpdir/qwe3017-luci-app/luci-app-pon-status" package/

      - name: Replace PON stack with naoki66 ONU config
        run: |
          # The pbs05 PON userspace feed and naoki66's stack both define
          # airoha-ponctl/airoha-pond/airoha-pon-debug; drop the feed copies so
          # the ONU packages below are the only ones the build sees.
          for pkg in airoha-pon-daemons airoha-ponctl airoha-pon-debug luci-app-pon luci-app-iptv; do
            rm -rf "package/feeds/pon_userspace/$pkg"
          done
          git clone https://github.com/naoki66/OpenWrt_ONU_CONFIG.git "$RUNNER_TEMP/onu-config"
          git -C "$RUNNER_TEMP/onu-config" checkout 00cd0c2186683484360950007040c1309bcb27fa
          cp -a "$RUNNER_TEMP/onu-config/airoha-pon-daemons" package/
          cp -a "$RUNNER_TEMP/onu-config/airoha-ponctl" package/
          cp -a "$RUNNER_TEMP/onu-config/airoha-pon-debug" package/
          cp -a "$RUNNER_TEMP/onu-config/luci-app-onu" package/
          # Voice has no hardware on the MF board; the patch drops the page,
          # its UCI package and its backend.
          patch --batch -E -d package -p1 < ci/patches/luci-app-onu-remove-voice.patch

      - name: Configure an7583
        run: |
          ./scripts/kconfig.pl + configs/an7583.config configs/release.config configs/mf-onu.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build an7583
        run: make -j"$(nproc)"

      - name: Pack output
        run: |
          mkdir release
          tar --zstd -cf release/ponwrt-an7583.tar.zst \
            -C bin/targets/airoha an7583
          cd release
          sha256sum ponwrt-an7583.tar.zst > sha256sums

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7583
          path: |
            release/ponwrt-an7583.tar.zst
            release/sha256sums
          if-no-files-found: error
          retention-days: 7
