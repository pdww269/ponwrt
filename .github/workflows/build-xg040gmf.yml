name: Build Nokia XG-040G-MF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build airoha/an7583
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7583-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7583-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure an7583
        run: |
          ./scripts/kconfig.pl + configs/an7583.config configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build an7583
        run: make -j"$(nproc)"

      - name: Pack output
        run: |
          mkdir release
          tar --zstd -cf release/ponwrt-an7583.tar.zst \
            -C bin/targets/airoha an7583
          cd release
          sha256sum ponwrt-an7583.tar.zst > sha256sums

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7583
          path: |
            release/ponwrt-an7583.tar.zst
            release/sha256sums
          if-no-files-found: error
          retention-days: 7
